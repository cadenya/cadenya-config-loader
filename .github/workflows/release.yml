name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  # The action downloads the release named by its version input's default. A tag
  # whose action.yml names a different release would ship an action that runs
  # the wrong binary.
  action-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check action.yml names this release
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(awk '/^  version:/ {found=1} found && /default:/ {gsub(/[^0-9A-Za-z.-]/, "", $2); print $2; exit}' action.yml)"
          if [[ "$have" != "$want" ]]; then
            echo "::error::action.yml's version input defaults to '$have', but this tag is $GITHUB_REF_NAME"
            exit 1
          fi
  release:
    needs: [verify, action-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --skip=publish
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release notes are the CHANGELOG.md section for this tag.
          awk -v tag="$GITHUB_REF_NAME" 'index($0, "## " tag " ") == 1 || $0 == "## " tag {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt "${args[@]}"
  # Run the action the way consumers do: downloading the release just published.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the released action
        id: action
        uses: ./
        with:
          command: validate
          directory: examples/basic
      - name: Check its outputs
        shell: bash
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          set -euo pipefail
          echo "$RESULT"
          [[ "$RESULT" == *'"valid":true'* ]]
