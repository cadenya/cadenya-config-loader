# Copy to .github/workflows/cadenya.yaml in a consuming repository.
name: Configure Cadenya
on:
  pull_request:
    paths:
      - .cadenya/**
      - cadenya.yaml
      - .github/workflows/cadenya.yaml
  push:
    branches: [main]
    paths:
      - .cadenya/**
      - cadenya.yaml
      - .github/workflows/cadenya.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Pull requests get an offline check. It needs no API key, so it's safe for forks.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin a release tag, or a reviewed commit SHA for stricter supply-chain control.
      - uses: cadenya/cadenya-config-loader@v0.1.2
        with:
          command: validate
  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: development
    # Serialize deployments for this workspace and bundle. Never cancel an apply in progress.
    concurrency:
      group: cadenya-development-support-tools
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: cadenya/cadenya-config-loader@v0.1.2
        id: cadenya
        with:
          command: apply
          api-key: ${{ secrets.CADENYA_API_KEY }}
          workspace-id: development
          bundle-key: support-tools
