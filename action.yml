name: Configure Cadenya
description: Validate, plan, or apply a source-controlled Cadenya workspace bundle
branding:
  icon: terminal
  color: purple
inputs:
  command:
    description: 'Operation: validate, plan, or apply'
    default: plan
  api-key:
    description: Cadenya API key (falls back to CADENYA_API_KEY)
    required: false
  workspace-id:
    description: Workspace ID or alias (overrides environment and cadenya.yaml)
    required: false
  bundle-key:
    description: Bundle ownership label (overrides environment and cadenya.yaml)
    required: false
  base-url:
    description: API origin without /v1 (overrides environment and cadenya.yaml)
    required: false
  directory:
    description: Repository root containing cadenya.yaml and .cadenya
    default: .
  config:
    description: Settings path relative to directory
    required: false
  resource-dir:
    description: Resource path relative to directory
    required: false
  allow-empty:
    description: Allow apply to delete an entire bundle when the resource tree is empty
    default: 'false'
  timeout:
    description: Timeout per HTTP request, in Go duration syntax
    default: 60s
  operation-timeout:
    description: Deadline for the complete plan or apply
    default: 10m
  retries:
    description: Retries for idempotent requests; creates and updates are never retried
    default: '2'
  log-level:
    description: 'Log level on stderr: debug, info, warn, or error'
    default: info
  log-format:
    description: 'Log format on stderr: text or json'
    default: text
  version:
    description: 'cadenya-config release to download. Defaults to the release this action revision belongs to; change it only to run a different release on purpose'
    default: '0.1.2'
  binary-path:
    description: 'Path to a cadenya-config binary to run instead of downloading a release, for runners without internet access or for testing a build'
    required: false
outputs:
  result:
    description: JSON result, including operations and completion status
    value: ${{ steps.run.outputs.result }}
  report-path:
    description: Path to the JSON result file on the runner
    value: ${{ steps.run.outputs.report-path }}
  creates:
    description: Number of planned creates
    value: ${{ steps.run.outputs.creates }}
  updates:
    description: Number of planned updates
    value: ${{ steps.run.outputs.updates }}
  deletes:
    description: Number of planned deletions
    value: ${{ steps.run.outputs.deletes }}
  detaches:
    description: Number of variations needing assignment removal before deletion
    value: ${{ steps.run.outputs.detaches }}
  state-changes:
    description: Number of planned agent publishes, unpublishes, and unarchives
    value: ${{ steps.run.outputs.state-changes }}
runs:
  using: composite
  steps:
    - name: Install cadenya-config
      id: install
      shell: bash
      env:
        CADENYA_VERSION: ${{ inputs.version }}
        CADENYA_BINARY: ${{ inputs.binary-path }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$*" >&2; exit 1; }
        if [[ -n "$CADENYA_BINARY" ]]; then
          [[ -f "$CADENYA_BINARY" ]] || fail "binary-path $CADENYA_BINARY does not exist"
          printf 'binary=%s\n' "$CADENYA_BINARY" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        version="${CADENYA_VERSION#v}"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "version must look like 1.2.3, got '$CADENYA_VERSION'"
        exe=""
        case "$RUNNER_OS" in
          Linux) os=linux ext=tar.gz ;;
          macOS) os=darwin ext=tar.gz ;;
          Windows) os=windows ext=zip exe=.exe ;;
          *) fail "unsupported runner OS $RUNNER_OS" ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) fail "unsupported runner architecture $RUNNER_ARCH" ;;
        esac
        dir="$RUNNER_TEMP/cadenya-config-$version-$os-$arch"
        binary="$dir/cadenya-config$exe"
        # A second use of the action in the same job reuses the download.
        if [[ ! -f "$binary" ]]; then
          archive="cadenya-config_${version}_${os}_${arch}.${ext}"
          base="https://github.com/cadenya/cadenya-config-loader/releases/download/v$version"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 --retry-connrefused -o "$archive" "$base/$archive" || fail "could not download $base/$archive"
          curl -fsSL --retry 3 --retry-connrefused -o checksums.txt "$base/checksums.txt" || fail "could not download $base/checksums.txt"
          expected="$(awk -v f="$archive" '$2 == f {print $1}' checksums.txt)"
          [[ -n "$expected" ]] || fail "checksums.txt has no entry for $archive"
          if command -v sha256sum >/dev/null; then
            actual="$(sha256sum "$archive" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          [[ "$actual" == "$expected" ]] || fail "checksum mismatch for $archive"
          if [[ "$ext" == zip ]]; then
            if command -v unzip >/dev/null; then
              unzip -q -o "$archive" "cadenya-config$exe"
            else
              powershell -NoProfile -Command "Expand-Archive -Force -LiteralPath '$archive' -DestinationPath ."
            fi
          else
            tar -xzf "$archive" cadenya-config
          fi
          rm -f "$archive" checksums.txt
        fi
        "$binary" --version
        printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
    - name: Run cadenya-config
      id: run
      shell: bash
      env:
        CADENYA_BINARY: ${{ steps.install.outputs.binary }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_WORKSPACE_ID: ${{ inputs.workspace-id }}
        INPUT_BUNDLE_KEY: ${{ inputs.bundle-key }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_RESOURCE_DIR: ${{ inputs.resource-dir }}
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_OPERATION_TIMEOUT: ${{ inputs.operation-timeout }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_LOG_LEVEL: ${{ inputs.log-level }}
        INPUT_LOG_FORMAT: ${{ inputs.log-format }}
      run: '"$CADENYA_BINARY" github-action'
